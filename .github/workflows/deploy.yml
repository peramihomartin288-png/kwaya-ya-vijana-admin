name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_CLOUDINARY_CLOUD_1: ${{ secrets.VITE_CLOUDINARY_CLOUD_1 }}
          VITE_CLOUDINARY_PRESET_1: ${{ secrets.VITE_CLOUDINARY_PRESET_1 }}
          VITE_CLOUDINARY_FOLDER_1: ${{ secrets.VITE_CLOUDINARY_FOLDER_1 }}
          VITE_CLOUDINARY_CLOUD_2: ${{ secrets.VITE_CLOUDINARY_CLOUD_2 }}
          VITE_CLOUDINARY_PRESET_2: ${{ secrets.VITE_CLOUDINARY_PRESET_2 }}
          VITE_CLOUDINARY_FOLDER_2: ${{ secrets.VITE_CLOUDINARY_FOLDER_2 }}
          VITE_CLOUDINARY_CLOUD_3: ${{ secrets.VITE_CLOUDINARY_CLOUD_3 }}
          VITE_CLOUDINARY_PRESET_3: ${{ secrets.VITE_CLOUDINARY_PRESET_3 }}
          VITE_CLOUDINARY_FOLDER_3: ${{ secrets.VITE_CLOUDINARY_FOLDER_3 }}
          VITE_CLOUDINARY_CLOUD_4: ${{ secrets.VITE_CLOUDINARY_CLOUD_4 }}
          VITE_CLOUDINARY_PRESET_4: ${{ secrets.VITE_CLOUDINARY_PRESET_4 }}
          VITE_CLOUDINARY_FOLDER_4: ${{ secrets.VITE_CLOUDINARY_FOLDER_4 }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=kmca-admin
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
